name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      # The "cloud import" needs a same-origin copy of the database: GitHub's
      # release-asset CDN (release-assets.githubusercontent.com) sends no CORS
      # headers, so a cross-origin fetch from the deployed site fails. Bundling
      # the asset into the Pages artifact makes {BASE_URL}datas/inducks.sqlite.gz
      # the reliable primary source the app tries first.
      - name: Download pre-built database into the site
        run: |
          mkdir -p public/datas
          gh release download datas --repo "$GITHUB_REPOSITORY" --pattern inducks.sqlite.gz --dir public/datas --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: pnpm run build
        env:
          VITE_TURSO_DATABASE_URL: ${{ secrets.VITE_TURSO_DATABASE_URL }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN }}
          VITE_GA_MEASUREMENT_ID: "G-YDE0FS0VYY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
