name: Generate SQLite Database

# Manual only. The weekly schedule was removed because it could not do what its
# name promised: `generate-db.ts` with no arguments pulls the .isv files from
# this very release, so each run recompiled the same frozen dataset and
# published it as if it were fresh.
#
# Refreshing for real needs https://inducks.org/inducks/isv.tgz, which sits
# behind Anubis (HTTP 403 for any unattended client), so a runner cannot fetch
# it. Use `pnpm db:build -- --archive <path>` locally against a browser-
# downloaded archive, then upload inducks.sqlite.gz to the `datas` release —
# or run this workflow to rebuild from whatever ISVs the release already holds.
on:
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Compile and Optimize Database
        run: npx tsx scripts/generate-db.ts

      - name: Upload or Update Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: datas
          name: "Inducks database"
          files: inducks.sqlite.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
